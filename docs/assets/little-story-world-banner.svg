<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">Little Story World</title>
<desc id="desc">Một cuốn sách đang mở giữa ánh sáng dịu dàng, những cánh hoa và đốm sáng bay lơ lửng.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fffaf2"/><stop offset="55%" stop-color="#fff1ed"/><stop offset="100%" stop-color="#f3efff"/></linearGradient>
  <radialGradient id="halo"><stop offset="0%" stop-color="#fff" stop-opacity=".9"/><stop offset="100%" stop-color="#f2cbd9" stop-opacity="0"/></radialGradient>
  <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b57c8b"/><stop offset="100%" stop-color="#7e668f"/></linearGradient>
  <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fffefb"/><stop offset="100%" stop-color="#f2e8f1"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    @keyframes floaty { 0%,100% { transform:translateY(0) rotate(-2deg) } 50% { transform:translateY(-12px) rotate(2deg) } }
    @keyframes twinkle { 0%,100% { opacity:.25; transform:scale(.75) } 50% { opacity:1; transform:scale(1.2) } }
    @keyframes sway { 0%,100% { transform:rotate(-4deg) } 50% { transform:rotate(4deg) } }
    .floaty { animation:floaty 7s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
    .twinkle { animation:twinkle 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
    .delay { animation-delay:1.4s }
    .petal { animation:sway 5s ease-in-out infinite; transform-box:fill-box; transform-origin:bottom center }
    .line { fill:none; stroke:#c9a6a1; stroke-width:2; stroke-linecap:round; opacity:.55 }
    @media(prefers-reduced-motion:reduce){.floaty,.twinkle,.petal{animation:none!important}}
  </style>
</defs>
<rect width="1280" height="430" rx="30" fill="url(#paper)"/>
<circle cx="1010" cy="200" r="240" fill="url(#halo)"/>
<circle cx="1120" cy="65" r="85" fill="#fff" opacity=".35" filter="url(#blur)"/>
<circle cx="720" cy="370" r="95" fill="#e9d8ea" opacity=".42" filter="url(#blur)"/>
<g opacity=".42" fill="none" stroke="#cdaeb2" stroke-width="1.5"><path d="M0 350 C170 290 230 450 390 392 S610 340 760 410"/><path d="M800 0 C900 90 1020 90 1280 18"/><path d="M0 60 C130 112 240 5 350 44"/></g>
<g class="twinkle" fill="#c58c9d"><path d="M735 80 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/><circle cx="1110" cy="95" r="5"/><circle cx="1210" cy="260" r="4"/></g>
<g class="twinkle delay" fill="#9d8ab6"><path d="M880 310 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/><circle cx="1040" cy="350" r="5"/><circle cx="690" cy="190" r="4"/></g>
<g transform="translate(88 110)">
  <text x="0" y="0" fill="#9a7180" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="5">A LITTLE PLACE FOR YOUR WORDS</text>
  <text x="0" y="88" fill="#493c4b" font-family="Georgia,serif" font-size="65" font-weight="600">Little Story</text>
  <text x="0" y="158" fill="#896578" font-family="Georgia,serif" font-size="65" font-style="italic">World</text>
  <path d="M2 186 C110 205 215 202 340 183" fill="none" stroke="#c78f9f" stroke-width="3" stroke-linecap="round"/>
  <text x="2" y="235" fill="#746775" font-family="Arial,sans-serif" font-size="19" letter-spacing="1.2">Viết nên điều đáng nhớ · Lưu giữ như một món quà</text>
  <text x="2" y="276" fill="#9c8796" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">WRITE · DECORATE · SHARE</text>
</g>
<g class="floaty" filter="url(#shadow)">
  <path d="M735 155 C805 112 892 128 953 155 L953 337 C882 304 803 302 735 342 Z" fill="url(#cover)"/>
  <path d="M953 155 C1024 119 1110 124 1170 159 L1170 342 C1098 309 1022 306 953 337 Z" fill="#8f789c"/>
  <path d="M745 143 C810 111 883 119 946 151 L946 321 C875 289 808 292 745 325 Z" fill="url(#page)"/>
  <path d="M960 151 C1025 120 1097 118 1160 145 L1160 325 C1095 292 1025 289 960 321 Z" fill="url(#page)"/>
  <path d="M953 151 L953 337" stroke="#b99ca8" stroke-width="5" opacity=".85"/>
  <path d="M770 177 C827 154 878 158 921 177 M770 202 C827 180 878 183 921 202 M770 227 C824 207 875 209 921 227 M770 252 C824 235 875 237 921 252" class="line"/>
  <path d="M985 177 C1036 156 1090 157 1137 177 M985 202 C1038 182 1088 183 1137 202 M985 227 C1038 209 1088 209 1137 227 M985 252 C1038 235 1088 236 1137 252" class="line"/>
  <path d="M870 275 C900 254 925 256 953 278 C982 256 1007 254 1037 275" fill="none" stroke="#d4a1a9" stroke-width="3" stroke-linecap="round"/>
</g>
<g class="petal" transform="translate(1170 75)">
  <path d="M0 34 C-30 5 -15 -25 3 -18 C28 -10 23 17 0 34Z" fill="#e9a9bb" opacity=".8"/>
  <path d="M0 34 C20 3 48 6 43 27 C39 46 15 47 0 34Z" fill="#d9b2d2" opacity=".8"/>
  <path d="M0 34 C-4 5 13 -10 27 3 C41 17 23 37 0 34Z" fill="#f4c5c9"/>
  <path d="M0 34 Q8 55 0 72" fill="none" stroke="#9da98a" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>