name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("Dependency audit summary:", JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (item.via ?? [])
              .map((entry) => typeof entry === "string" ? entry : entry.title)
              .filter(Boolean)
              .join("; ");
            console.log(`${item.severity}: ${name} (direct: ${item.isDirect}) — ${advisories || "No advisory title"}; fix: ${JSON.stringify(item.fixAvailable)}`);
          }
          NODE

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_TELEMETRY_DISABLED: "1"
