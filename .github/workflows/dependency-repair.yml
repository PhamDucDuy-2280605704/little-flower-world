name: One-time safe dependency repair

on:
  push:
    branches:
      - maintenance/dependency-repair

permissions:
  contents: write

concurrency:
  group: dependency-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Apply only semver-compatible dependency fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Reinstall from the updated lockfile
        run: npm ci

      - name: Report remaining dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (item.via ?? [])
              .map((entry) => typeof entry === "string" ? entry : entry.title)
              .filter(Boolean)
              .join("; ");
            console.log(`${item.severity}: ${name} (direct: ${item.isDirect}) — ${advisories || "No advisory title"}; fix: ${JSON.stringify(item.fixAvailable)}`);
          }
          NODE

      - name: Require a clean production dependency tree
        run: npm audit --omit=dev --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit compatible lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible lockfile changes were available."
            exit 0
          fi
          git commit -m "fix: refresh compatible dependency patches [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
